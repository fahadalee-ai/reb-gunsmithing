<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>REB Gunsmithing Preview </title>
  <style>
    :root {
      --bg: #07090c;
      --shadow: rgba(0, 0, 0, 0.45);
      --frameStrokeOuter: #37373a;
      --frameStrokeInner: #454548;
      --frameStrokeGlow: #454548;
      --screenBg: #0e1218;
      --homeBar: rgba(255, 255, 255, 0.64);
      --status: #ffffff;
    }

    * { box-sizing: border-box; }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--bg);
      scrollbar-width: none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    iframe::-webkit-scrollbar {
      display: none;
    }

    .gridBg {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px 16px;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
      background-size: 34px 34px;
    }

    .phoneWrap {
      width: min(340px, 92vw);
      height: min(700px, 86vh);
      position: relative;
    }

    .phoneSvg,
    .overlaySvg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .phoneSvg {
      z-index: 1;
      filter: drop-shadow(0 18px 50px var(--shadow));
    }

    .screen {
      position: absolute;
      left: 4.215%;
      top: 2.043%;
      width: 91.335%;
      height: 95.8%;
      z-index: 2;
      overflow: hidden;
      background: var(--screenBg);
      border-radius: 14%;
    }

    .overlaySvg {
      z-index: 3;
      pointer-events: none;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: var(--screenBg);
      scrollbar-width: none;
    }
  </style>
</head>
<body>
  <div class="gridBg">
    <div class="phoneWrap" aria-label="Phone preview">
      <svg class="phoneSvg" viewBox="0 0 427 881" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
        <g clip-path="url(#clip0)">
          <rect width="426.667" height="880.667" rx="70" fill="black"></rect>
          <rect x="3.833" y="3.834" width="419" height="873" rx="66.167" style="stroke: var(--frameStrokeInner)" stroke-width="4.333"></rect>
          <rect x="0.833" y="0.833" width="425" height="879" rx="69.167" style="stroke: var(--frameStrokeOuter)" stroke-width="1.667"></rect>
          <rect x="-1.8" y="168" width="3.2" height="38" rx="1.6" fill="#1a1a1c"></rect>
          <rect x="-1.8" y="222" width="3.2" height="62" rx="1.6" fill="#1a1a1c"></rect>
          <rect x="-1.8" y="296" width="3.2" height="62" rx="1.6" fill="#1a1a1c"></rect>
          <rect x="425.3" y="230" width="3.2" height="90" rx="1.6" fill="#1a1a1c"></rect>
        </g>
        <defs>
          <clipPath id="clip0">
            <rect width="426.667" height="880.667" rx="70"></rect>
          </clipPath>
        </defs>
      </svg>

      <div class="screen" id="screen">
        <iframe id="previewFrame" title="REB Gunsmithing" referrerpolicy="no-referrer"></iframe>
      </div>

      <svg class="overlaySvg" viewBox="0 0 427 881" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
        <text id="statusTime" x="72" y="55" fill="white" font-size="17" font-weight="600" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">9:41</text>
        <g opacity="0.9">
          <rect x="297" y="49" width="3.4" height="5" rx="0.6" fill="white"></rect>
          <rect x="302" y="47" width="3.4" height="7" rx="0.6" fill="white"></rect>
          <rect x="307" y="44.5" width="3.4" height="9.5" rx="0.6" fill="white"></rect>
          <rect x="312" y="42" width="3.4" height="12" rx="0.6" fill="white"></rect>
        </g>
        <g opacity="0.9" fill="white">
          <path d="M341.382 45.878C339.208 43.689 336.196 42.334 332.867 42.334C329.528 42.334 326.508 43.697 324.333 45.897L326.219 47.783C327.911 46.065 330.265 45 332.867 45C335.459 45 337.805 46.057 339.496 47.763L341.382 45.878Z"></path>
          <path d="M338.318 48.942C336.928 47.537 334.999 46.667 332.867 46.667C330.725 46.667 328.788 47.545 327.397 48.962L329.283 50.847C330.191 49.914 331.462 49.334 332.867 49.334C334.263 49.334 335.525 49.905 336.432 50.828L338.318 48.942Z"></path>
          <path d="M335.253 52.006C334.648 51.386 333.803 51 332.867 51C331.922 51 331.068 51.394 330.462 52.026L332.847 54.412L335.253 52.006Z"></path>
        </g>
        <g opacity="0.9">
          <rect x="351.166" y="43.167" width="22.333" height="10.667" rx="2.167" stroke="white" stroke-width="1" opacity="0.45"></rect>
          <rect x="352.5" y="44.5" width="19.5" height="8" rx="1.2" fill="white"></rect>
        </g>
        <rect x="151.666" y="31.667" width="123.333" height="36" rx="18" fill="black"></rect>
        <rect width="139" height="5" rx="2.5" transform="matrix(-1 0 0 1 284 849)" style="fill: var(--homeBar)"></rect>
      </svg>
    </div>
  </div>

  <script>
    function appUrl() {
      const params = new URLSearchParams(location.search);
      const override = params.get("url");
      if (override) {
        try {
          const url = new URL(override);
          if (url.protocol === "http:" || url.protocol === "https:") return url.toString();
        } catch {
          /* ignore a bad override */
        }
      }
      if (location.protocol === "file:") return "http://localhost:8080/";
      return new URL("/", location.origin).href;
    }

    const frame = document.getElementById("previewFrame");
    frame.src = appUrl();

    const screen = document.getElementById("screen");
    function fitScreen() {
      const box = screen.getBoundingClientRect();
      const radius = box.width * (55 / 390);
      screen.style.borderRadius = Math.round(radius) + "px";
      screen.style.paddingTop = Math.round(box.height * (62 / 844)) + "px";
      screen.style.paddingBottom = Math.round(box.height * (34 / 844)) + "px";
    }
    fitScreen();
    window.addEventListener("resize", function () {
      requestAnimationFrame(fitScreen);
    });

    const timeEl = document.getElementById("statusTime");
    function tick() {
      timeEl.textContent = new Intl.DateTimeFormat(undefined, {
        hour: "numeric",
        minute: "2-digit",
      }).format(new Date());
    }
    tick();
    setInterval(tick, 30000);
  </script>
</body>
</html>
